# Behind Cloudflare the real client IP arrives in CF-Connecting-IP; locally it is the peer address.
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  # The feedback service trusts X-Client-IP, which a caller could forge. That is safe
  # only because compose binds this port to 127.0.0.1 and the service itself is unpublished.
  location = /api/feedback {
    # A variable plus a resolver lets nginx start even when the feedback service is down.
    resolver 127.0.0.11 valid=10s;
    set $fb http://feedback:8787;
    proxy_pass $fb;
    proxy_set_header X-Client-IP $client_ip;
    client_max_body_size 64k;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
